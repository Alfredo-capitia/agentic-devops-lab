name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee test.log

      - name: Investigate test failure
        id: investigate
        if: always() && steps.tests.outcome == 'failure'
        run: |
          go run ./cmd/ci-investigator < test.log > ci-investigation.json
          echo "Investigation report:"
          cat ci-investigation.json

      - name: Upload investigation report
        if: always() && hashFiles('ci-investigation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation
          path: ci-investigation.json
          if-no-files-found: error
          retention-days: 7

      - name: Build application
        run: go build -o /tmp/agentic-devops-lab ./...
