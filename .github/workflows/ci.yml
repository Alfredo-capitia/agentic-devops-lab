name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Go code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          files="$(find . -name '*.go' -not -path './.git/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "These Go files need gofmt:"
            echo "$files"
            echo "$files" > format.log
            exit 1
          fi
          echo "All Go files are formatted." | tee format.log

      - name: Run go vet
        id: vet
        continue-on-error: true
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet.log

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          go test -v ./... 2>&1 | tee test.log

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          go build -v ./... 2>&1 | tee build.log

      - name: Prepare investigation input
        if: always()
        run: |
          {
            echo "=== FORMATTING ==="
            cat format.log 2>/dev/null || true
            echo "=== GO VET ==="
            cat vet.log 2>/dev/null || true
            echo "=== TESTS ==="
            cat test.log 2>/dev/null || true
            echo "=== BUILD ==="
            cat build.log 2>/dev/null || true
          } > ci.log

      - name: Investigate CI failure
        id: investigate
        if: always() && (steps.format.outcome == 'failure' || steps.vet.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure')
        run: |
          go run ./cmd/ci-investigator < ci.log > ci-investigation.json
          echo "Investigation report:"
          cat ci-investigation.json

      - name: Upload investigation artifacts
        if: always() && steps.investigate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-investigation
          path: |
            ci-investigation.json
            ci.log
            format.log
            vet.log
            test.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce CI result
        if: always()
        run: |
          failed=0

          for result in \
            "${{ steps.format.outcome }}" \
            "${{ steps.vet.outcome }}" \
            "${{ steps.tests.outcome }}" \
            "${{ steps.build.outcome }}"; do
            if [ "$result" = "failure" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "One or more validation steps failed."
            exit 1
          fi

          echo "All validation steps passed."
